#FLASH
CONFIG_STDOUT_CONSOLE=y
CONFIG_FLASH=y
CONFIG_LOG=y
CONFIG_EVENTS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_FLASH_LOG_LEVEL_DBG=n

# CRC32 used by flash_to_psram_verify()
CONFIG_CRC=y

# Bring-up diagnostics: flush prints synchronously and dump faults.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EXCEPTION_STACK_TRACE=y

#RAM
CONFIG_PRINTK=y
CONFIG_ARM_MPU=y
CONFIG_MEMC=y
CONFIG_MEMC_OSPI_ALIF=y
CONFIG_USE_ALIF_HAL_OSPI=y
